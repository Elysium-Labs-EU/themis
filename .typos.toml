# Config for https://github.com/crate-ci/typos
# CHANGELOG.md is generated by `git-cliff` from commit history; typos in old
# commit subjects aren't ours to fix here.
[files]
extend-exclude = ["CHANGELOG.md"]

[default.extend-words]
# OpenSCAP / SCAP is a real acronym (Security Content Automation Protocol),
# not a typo for "scab"/"scrap".
scap = "scap"
# "mis-parsed" is a deliberate hyphenated prefix, not "mist"/"miss".
mis = "mis"
# Test fixture source name in registry_test.go, not "option".
optin = "optin"
# "[c]urrent connection" keybinding hint in cmd/apply.go, not "current"/"urgent".
urrent = "urrent"
