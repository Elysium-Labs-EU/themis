name: CI

# The ci job calls `make ci` directly rather than re-declaring each check in
# YAML: the Makefile is the single source of truth for what "passing" means
# (test, lint, ast-grep, nilaway, coverage floor, go-crap change-risk gate),
# so this workflow can't silently drift from it -- previously this job only
# ran a hand-copied subset (test + coverage), skipping lint, ast-grep, and
# nilaway entirely on every push and PR.
on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  merge_group:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0 # go-crap-gate diffs changed functions against origin/main

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod

      - name: Install dev tools
        run: make setup

      - name: Run CI gate
        run: make ci

  integration-test:
    name: Integration Test (root)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod

      - name: Install dependencies
        run: go mod download

      # lynis powers the B3 audit test; if the runner can't reach the apt
      # mirror the install is best-effort and the test self-skips (t.Skip on
      # missing lynis) rather than failing the job.
      - name: Install lynis (best-effort)
        continue-on-error: true
        run: |
          sudo apt-get update
          sudo apt-get install -y lynis

      # THEMIS_INTEGRATION_MUTATE is intentionally UNSET, so the host-mutating
      # B1 fix apply/revert tests self-skip (they install packages + enable
      # services, which CI can't support). They run for real on OrbStack via
      # `make test-integration-orb`. The B2 hermetic self-update test is fully
      # self-contained and runs here; B3 lynis runs or skips depending on the
      # install step above.
      - name: Run integration tests
        run: go test ./... -tags integration -v -count=1

  signing-key-sync:
    name: Signing Key Sync
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Check install.sh and cmd/update.go embed the same signing key
        run: bash scripts/check-signing-key-sync.sh

  typos:
    name: Typos
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Check for typos
        uses: crate-ci/typos@8a48f81b6c64dcfea44b3633223084c4be58ac5f # v1.49.0

  file-size-guard:
    name: File Size Guard
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0 # need origin/main to diff the PR against

      - name: Reject oversized or binary files in the diff
        run: bash scripts/check-file-size.sh

  verify-build:
    name: Verify Build
    runs-on: ubuntu-latest
    needs: [ci]
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod

      - name: Verify code compiles
        run: go build -v ./...
