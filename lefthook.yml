pre-push:
  commands:
    coverage:
      glob: "*.go"
      run: make test-coverage-check
      priority: 1

    crap:
      glob: "*.go"
      run: make crap
      priority: 2

pre-commit:
  commands:
    format:
      glob: "*.go"
      run: golangci-lint fmt && git add {staged_files}
      priority: 1

    lint:
      glob: "*.go"
      run: golangci-lint run --timeout=5m
      priority: 2

    mod-verify:
      glob: "go.{mod,sum}"
      run: go mod verify
      priority: 2

    fieldalignment:
      glob: "*.go"
      run: go tool fieldalignment ./...
      priority: 2

    any-convention:
      glob: "*.go"
      run: bash scripts/check-any-convention.sh
      priority: 2

    file-size:
      run: bash scripts/check-file-size.sh
      priority: 2

    test:
      glob: "*.go"
      run: go test -short ./...
      priority: 3
